name: 行业资讯雷达 - 自动数据更新

on:
  # 每天北京时间 04:00 触发（凌晨低峰期，减少限流风险）
  # UTC: 20:00 (前一日)
  schedule:
    - cron: '0 20 * * *'   # 北京时间次日 04:00

  # 允许手动触发
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新（忽略开关状态和冷却期）'
        required: false
        default: 'false'

# 冷却期：在此日期之前所有 schedule 触发都会自动跳过（UTC 时间戳）
# 2026-08-03 04:00 CST = 2026-08-02 20:00 UTC = 1785038400
env:
  RESUME_AFTER_UTC_TS: '1785038400'

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      # 2. 检查自动更新开关 + 冷却期
      - name: Check auto-update switch
        id: check-switch
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "✅ 强制更新模式（跳过冷却期检查）"
            exit 0
          fi

          # 冷却期检查：仅对 schedule 生效；workflow_dispatch 未开 force 也要遵守
          NOW=$(date -u +%s)
          RESUME_TS=${RESUME_AFTER_UTC_TS:-0}
          if [ "$NOW" -lt "$RESUME_TS" ]; then
            REMAIN=$(( (RESUME_TS - NOW) / 3600 ))
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "🧊 冷却期未过（剩余约 ${REMAIN} 小时），跳过本次执行。恢复时间：2026-08-03 04:00 CST"
            exit 0
          fi

          CONFIG_FILE="data-snapshot/auto-update-config.json"
          if [ -f "$CONFIG_FILE" ]; then
            ENABLED=$(node -e "const c=require('./$CONFIG_FILE'); console.log(c.enabled ? 'true' : 'false')" 2>/dev/null || echo "true")
          else
            ENABLED="true"
          fi

          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          if [ "$ENABLED" = "true" ]; then
            echo "✅ 自动更新已开启，继续执行"
          else
            echo "⏸ 自动更新已关闭，跳过本次执行"
          fi

      # 3. 设置 Node.js
      - name: Setup Node.js
        if: steps.check-switch.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. 安装依赖（使用 Node.js 内置模块，无需 npm install）
      - name: Install dependencies
        if: steps.check-switch.outputs.enabled == 'true'
        run: echo "无需安装额外依赖，使用 Node.js 内置模块"

      # 5. 拉取数据（通过微信公众号后台 appmsg 接口）
      - name: Fetch articles from WeChat MP API
        if: steps.check-switch.outputs.enabled == 'true'
        env:
          WECHAT_COOKIE: ${{ secrets.WECHAT_COOKIE }}
          WECHAT_TOKEN:  ${{ secrets.WECHAT_TOKEN }}
          CUTOFF_DAYS: '1095'
        run: |
          echo "📥 开始拉取公众号文章（微信后台接口）..."
          node scripts/fetch-data.js
          echo "✅ 文章拉取完成"

      # 6. 生成 AI 摘要
      - name: Generate AI summaries
        if: steps.check-switch.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: 'deepseek-chat'
        run: |
          echo "🤖 开始生成 AI 摘要..."
          node scripts/generate-summary.js
          echo "✅ AI 摘要生成完成"

      # 7. 检查是否有变更
      - name: Check for changes
        if: steps.check-switch.outputs.enabled == 'true'
        id: check-changes
        run: |
          git diff --quiet data-snapshot/ || echo "has_changes=true" >> $GITHUB_OUTPUT
          git status --short data-snapshot/

      # 8. 提交并推送
      - name: Commit and push
        if: steps.check-switch.outputs.enabled == 'true' && steps.check-changes.outputs.has_changes == 'true'
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          git add data-snapshot/
          git commit -m "chore: 自动更新数据快照 [${TIMESTAMP} CST]"
          git push

          echo "✅ 数据已推送，Cloudflare Pages 将自动部署"

      # 9. 无变更时记录
      - name: No changes
        if: steps.check-switch.outputs.enabled == 'true' && steps.check-changes.outputs.has_changes != 'true'
        run: echo "ℹ️ 数据无变更，跳过提交"
